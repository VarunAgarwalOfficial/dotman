<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prioritize Font Awesome for icon glyphs over Nerd Fonts -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>{{ font_icons }}</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend">
      <string>{{ font_icons }}</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend">
      <string>{{ font_icons }}</string>
    </edit>
  </match>

  <!-- Default Sans-Serif Font -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>{{ font_main }}</family>
      <family>{{ font_emoji }}</family>
    </prefer>
  </alias>

  <!-- Default Serif Font -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>{{ font_heading }}</family>
      <family>{{ font_emoji }}</family>
    </prefer>
  </alias>

  <!-- Default Monospace Font -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>{{ font_main }}</family>
      <family>{{ font_emoji }}</family>
    </prefer>
  </alias>
</fontconfig>
