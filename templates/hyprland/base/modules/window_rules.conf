windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}


windowrule {
    name = floating
    match:class = ^(floating)$
    float = on
    center = on
    no_anim = on
    size = monitor_w*.6 monitor_h*0.6 
}

windowrule {
    name = fullscreen
    match:class = fullscreen
    float = on
    size = monitor_w monitor_h
    move = 0 0 
    no_anim = on
}
# Apply it to launcher
layerrule = animation fade, match:namespace launcher