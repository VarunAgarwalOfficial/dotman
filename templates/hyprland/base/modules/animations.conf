animations {
   enabled = yes

   # Curves: smooth deceleration for open, acceleration for close
   bezier = easeOut, 0.16, 1, 0.3, 1
   bezier = easeIn,  0.4,  0, 0.2, 1

   # Base
   animation = global,        1, 5, easeOut

   # Windows: Slide vertical (up/down)
   animation = windows,       1, 3, easeOut
   animation = windowsIn,     1, 2.5, easeOut, slide up
   animation = windowsOut,    1, 1.2, easeIn,  slide down
   animation = fadeIn,        1, 2, easeOut
   animation = fadeOut,       1, 1.5, easeIn

   # Layers: Slide horizontal (left/right) 
   animation = layers,        1, 3, easeOut
   animation = layersIn,      1, 2.5, easeOut, slide left
   animation = layersOut,     1, 1.2, easeIn,  slide right
   
   # Launcher fade: instant (no curve needed)
   animation = fadeLayers,    1, 1, default
   animation = fadeLayersIn,  1, 1, default
   animation = fadeLayersOut, 1, 1, default


   # Workspaces: Slide horizontal (right/left) - different from layers
   animation = workspaces,    1, 2.5, easeOut
   animation = workspacesIn,  1, 2, easeOut, slide right
   animation = workspacesOut, 1, 1.5, easeIn, slide left

   # Misc
   animation = border,        1, 3, easeOut
   animation = zoomFactor,    1, 4, easeIn
}