font={{ font_main }}:size={{ font_size }}
pad={{ padding }}x{{ padding }}

[colors-dark]
alpha=1.0
background={{ bg0 | strip }}
foreground={{ fg0 | strip }}
flash={{ bg2 | strip }}
flash-alpha=0.5

regular0={{ black | strip }}
regular1={{ red | strip }}
regular2={{ green | strip }}
regular3={{ yellow | strip }}
regular4={{ blue | strip }}
regular5={{ magenta | strip }}
regular6={{ cyan | strip }}
regular7={{ white | strip }}

bright0={{ bright_black | strip }}
bright1={{ bright_red | strip }}
bright2={{ bright_green | strip }}
bright3={{ bright_yellow | strip }}
bright4={{ bright_blue | strip }}
bright5={{ bright_magenta | strip }}
bright6={{ bright_cyan | strip }}
bright7={{ bright_white | strip }}

[csd]
size=26
font={{ font_main }}:size={{ font_size * 2 }}
